<?xml version="1.0" encoding="UTF-8"?>
<!-- Novaris primary logo — horizontal lockup. Colors: Paper, Ink, Teal (3). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Novaris logo">
  <title>Novaris</title>
  <rect width="640" height="200" fill="#f3f0ea"/>
  <!-- Threshold mark: raised diamond (aris) + baseline (threshold) -->
  <g transform="translate(72 100)">
    <rect x="-22" y="-22" width="44" height="44" fill="#0f766e" transform="rotate(45)"/>
    <rect x="-28" y="34" width="56" height="4" rx="2" fill="#14181f" opacity="0.85"/>
  </g>
  <!-- Wordmark -->
  <text x="148" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#14181f" letter-spacing="-1.5">Novaris</text>
  <text x="150" y="142" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#5c6570" letter-spacing="0.2">Practice before the moment.</text>
</svg>
