  <rect width="640" height="200" fill="#14181f"/>
  <g transform="translate(72 100)">
    <rect x="-22" y="-22" width="44" height="44" fill="#0f766e" transform="rotate(45)"/>
    <rect x="-28" y="34" width="56" height="4" rx="2" fill="#f3f0ea" opacity="0.9"/>
  </g>
  <text x="148" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#f3f0ea" letter-spacing="-1.5">Novaris</text>
  <text x="150" y="142" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#e8e3da" letter-spacing="0.2">Practice before the moment.</text>
